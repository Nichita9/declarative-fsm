name: "Обработка заявки на доступ"

initial_state: "заявка создана"

states:
  - "заявка создана"
  - "заявка на рассмотрении"
  - "ожидание уточнения"
  - "доступ предоставлен"
  - "заявка отклонена"

final_states:
  - "доступ предоставлен"
  - "заявка отклонена"

transitions:
  - from: "заявка создана"
    to: "заявка на рассмотрении"
    action: "отправить заявку"

  - from: "заявка на рассмотрении"
    to: "ожидание уточнения"
    action: "запросить уточнение"

  - from: "ожидание уточнения"
    to: "доступ предоставлен"
    action: "одобрить после уточнения"

  - from: "заявка на рассмотрении"
    to: "доступ предоставлен"
    action: "одобрить заявку"

  - from: "заявка на рассмотрении"
    to: "заявка отклонена"
    action: "отклонить заявку"
