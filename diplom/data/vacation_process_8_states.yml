name: обработка заявки на отпуск
initial_state: заявка создана
final_states:
  - отпуск согласован
  - заявка отклонена

states:
  - заявка создана
  - данные заполнены
  - проверка руководителем
  - проверка отделом кадров
  - ожидание замены
  - приказ формируется
  - отпуск согласован
  - заявка отклонена

transitions:
  - from: заявка создана
    to: данные заполнены
    action: заполнить заявку
  - from: данные заполнены
    to: проверка руководителем
    action: отправить руководителю
  - from: проверка руководителем
    to: проверка отделом кадров
    action: согласовать руководителем
  - from: проверка руководителем
    to: заявка отклонена
    action: отклонить руководителем
  - from: проверка отделом кадров
    to: ожидание замены
    action: требуется замена
  - from: проверка отделом кадров
    to: приказ формируется
    action: подтвердить кадровым отделом
  - from: ожидание замены
    to: приказ формируется
    action: назначить замену
  - from: приказ формируется
    to: отпуск согласован
    action: выпустить приказ
