name: оформление кредитной заявки
initial_state: заявка создана
final_states:
  - заявка завершена
  - заявка отменена
  - документы отклонены
  - скоринг не пройден

states:
  - заявка создана
  - данные заполнены
  - документы загружены
  - документы проверяются
  - документы отклонены
  - скоринг выполняется
  - скоринг пройден
  - скоринг не пройден
  - решение менеджера
  - договор формируется
  - договор отправлен клиенту
  - договор подписан
  - деньги перечисляются
  - заявка завершена
  - заявка отменена

hooks:
  before_transition: перед переходом
  after_transition: после перехода

on_enter:
  документы проверяются: уведомить специалиста
  договор отправлен клиенту: отправить договор клиенту
  заявка завершена: уведомить о завершении

transitions:
  - from: заявка создана
    to: данные заполнены
    action: заполнить данные
    description: Клиент заполняет анкету
  - from: данные заполнены
    to: документы загружены
    action: загрузить документы
    description: Клиент прикрепляет паспорт и подтверждающие документы
  - from: документы загружены
    to: документы проверяются
    action: отправить на проверку
    description: Документы передаются сотруднику на проверку
  - from: документы проверяются
    to: скоринг выполняется
    action: подтвердить документы
    condition: документы_корректны == True
    description: Переход разрешён только при корректных документах
  - from: документы проверяются
    to: документы отклонены
    action: отклонить документы
    condition: документы_корректны == False
    description: Процесс завершается, если документы некорректны
  - from: скоринг выполняется
    to: скоринг пройден
    action: выполнить скоринг
    condition: рейтинг >= 70 and сумма <= 300000
    description: Автоматическое прохождение скоринга
  - from: скоринг выполняется
    to: решение менеджера
    action: выполнить скоринг
    condition: рейтинг >= 70 and сумма > 300000
    description: Крупная сумма требует ручного решения менеджера
  - from: скоринг выполняется
    to: скоринг не пройден
    action: выполнить скоринг
    condition: рейтинг < 70
    description: Низкий рейтинг завершает процесс отказом
  - from: решение менеджера
    to: договор формируется
    action: одобрить вручную
    condition: менеджер_одобрил == True
    description: Менеджер одобряет крупную заявку
  - from: решение менеджера
    to: заявка отменена
    action: отклонить вручную
    condition: менеджер_одобрил == False
    description: Менеджер отклоняет крупную заявку
  - from: скоринг пройден
    to: договор формируется
    action: сформировать договор
    description: Договор формируется после автоматического одобрения
  - from: договор формируется
    to: договор отправлен клиенту
    action: отправить договор
    description: Договор отправляется клиенту на подписание
  - from: договор отправлен клиенту
    to: договор подписан
    action: подписать договор
    condition: клиент_подписал == True
    description: Клиент подписывает договор
  - from: договор отправлен клиенту
    to: заявка отменена
    action: отказаться от договора
    condition: клиент_подписал == False
    description: Клиент отказывается от договора
  - from: договор подписан
    to: деньги перечисляются
    action: начать перечисление
    description: Банк начинает перечисление денег
  - from: деньги перечисляются
    to: заявка завершена
    action: подтвердить перечисление
    condition: деньги_перечислены == True
    description: Процесс успешно завершается после перечисления денег
