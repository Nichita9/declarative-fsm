[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "declarative-fsm"
version = "0.1.0"
description = "Declarative finite-state workflow engine for business processes"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name" }
]
license = { text = "MIT" }
keywords = ["fsm", "workflow", "business-process", "declarative", "yaml"]
dependencies = [
    "PyYAML>=6.0",
    "Pillow>=10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0"
]

[tool.setuptools.packages.find]
include = ["declarative_fsm*"]

[project.scripts]
dfsm = "declarative_fsm.cli:main"
